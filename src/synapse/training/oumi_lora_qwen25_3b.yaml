run_name: qwen25-3b-intent-lora
output_dir: ./artifacts/qwen25-3b-intent-lora

model:
  name_or_path: Qwen/Qwen2.5-3B-Instruct
  trust_remote_code: true

data:
  train_file: ./data/dataset_train.jsonl
  eval_file: ./data/dataset_eval.jsonl
  chat_template: true

training:
  method: lora
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  # LoRA trains a small number of parameters and wants a higher rate than a
  # full fine-tune. 2e-5 is a full fine-tune rate; at this adapter size it
  # barely moves the weights.
  learning_rate: 2e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  bf16: false
  fp16: true

lora:
  # r=16 with alpha=32 gives the adapter enough capacity for the two output
  # schemas (classification and memory analysis) in one model.
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
